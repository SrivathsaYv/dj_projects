
<!DOCTYPE html>
<html>
<head>
    <title>Change Email</title>
</head>
<body>

    <h1>Edit Email</h1>

    <form method="POST" action="../db/update/email">

        {% csrf_token %}

        <label for="old_email">Old Email:</label>

        <input type="email"
               id="old_email"
               name="old_email"
               value="{{ email }}">

        <br><br>

        <label for="new_email">New Email:</label>

        <input type="email"
               id="new_email"
               name="new_email"
               required>

        <input type="hidden"
               name="roll_number"
               value="{{ roll_number }}">

        <br><br>

        <input type="submit" value="Submit">

    </form>

</body>
</html>
